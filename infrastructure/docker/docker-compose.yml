version: "3.9"

# Run with: docker compose -f infrastructure/docker/docker-compose.yml up
# Requires a .env file at the repo root

services:
  # ── Infrastructure ─────────────────────────────────────────
  postgres:
    image: supabase/postgres:15.1.0.117
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: demand_radar
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # ── Services ───────────────────────────────────────────────
  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    env_file: ../../.env
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ai-worker:
    build:
      context: ../../apps/ai-worker
      dockerfile: Dockerfile
    env_file: ../../.env
    ports:
      - "8000:8000"

  collector-worker:
    build:
      context: ../..
      dockerfile: workers/collector/Dockerfile
    env_file: ../../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  enrich-worker:
    build:
      context: ../..
      dockerfile: workers/enrich/Dockerfile
    env_file: ../../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-worker:
        condition: service_started

  notifier-worker:
    build:
      context: ../..
      dockerfile: workers/notifier/Dockerfile
    env_file: ../../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
